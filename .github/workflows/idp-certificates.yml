name: IdP certificates
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/idp_certificates/**'
      - 'scripts/check-idp-certificates'
      - '.github/workflows/idp-certificates.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Check the IdP certificates
      run: scripts/check-idp-certificates

    - name: Open an issue on failure
      if: failure() && github.event_name == 'schedule'
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        title="IdP certificates need to be updated"
        if [ -z "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
          gh issue create --title "$title" --body "The weekly check of \`data/idp_certificates\` failed: $RUN_URL"
        fi
