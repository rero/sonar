#
# Example of a full-stack production environment for Invenio.
#
# Usage::
#
#   $ ./docker/build-images.sh
#   $ docker-compose -f docker-compose.full.yml up -d
#   $ ./docker/wait-for-services.sh --full
#   $ docker-compose -f docker-compose.full.yml run --rm web-ui ./scripts/setup
#
# This file is not intended to be used in production, but only serve as an
# example of a full production environment.
#
# Following services are included:
# - Load balancer: HAProxy (exposed ports: 80, 443, 8080)
# - Frontend server: Nginx (not exposed)
# - UI application: Granian (not exposed)
# - API application: Granian, mounted on /api (not exposed)
# - Worker: Celery (not exposed)
# - Flower: Monitoring of Celery (exposed port: 5555)
# - Cache: Redis (exposed port: 6379)
# - DB: (PostgresSQL/MySQL) (exposed port: 5432 or 3306)
# - Message queue: RabbitMQ (exposed ports: 5672, 15672)
# - OpenSearch (exposed ports: 9200, 9300)
#
services:
  # Load balancer
  # http://127.0.0.1 (redirects to https)
  # https://127.0.0.1 (application)
  # http://127.0.0.1:8080 (HAProxy statistics)
  lb:
    extends:
      file: docker-services.yml
      service: lb
    links:
      - frontend
  # Frontend
  frontend:
    extends:
      file: docker-services.yml
      service: frontend
    links:
      - web-ui
      - web-api
  # UI Application
  web-ui:
    extends:
      file: docker-services.yml
      service: app
    # Granian also serves /static, from the image.
    # One string: the image entrypoint is `bash -c`.
    command:
      - >-
        uv run --no-sync granian --interface wsgi --host 0.0.0.0 --port 5000
        --workers 2 --blocking-threads 2 --respawn-failed-workers --access-log
        --static-path-route /static --static-path-mount /invenio/var/instance/static
        invenio_app.wsgi_ui:application
    image: sonar
    ports:
      - "5000"
    links:
      - cache
      - os
      - mq
      - db
  # API Rest Application
  web-api:
    extends:
      file: docker-services.yml
      service: app
    # One string: the image entrypoint is `bash -c`.
    command:
      - >-
        uv run --no-sync granian --interface wsgi --host 0.0.0.0 --port 5001
        --workers 2 --blocking-threads 2 --respawn-failed-workers --access-log
        --url-path-prefix /api
        invenio_app.wsgi_rest:application
    image: sonar
    ports:
      - "5001"
    links:
      - cache
      - os
      - mq
      - db
  # Worker
  worker:
    extends:
      file: docker-services.yml
      service: app
    restart: "unless-stopped"
    command: ["celery --app sonar.celery worker --loglevel=INFO"]
    image: sonar
    links:
      - cache
      - os
      - mq
      - db
  # Monitoring of Celery
  # http://127.0.0.1:5555
  flower:
    extends:
      file: docker-services.yml
      service: flower
    links:
      - mq
  # Base services
  cache:
    extends:
      file: docker-services.yml
      service: cache
  db:
    extends:
      file: docker-services.yml
      service: db
  # http://guest:guest@127.0.0.1:15672
  mq:
    extends:
      file: docker-services.yml
      service: mq
  os:
    extends:
      file: docker-services.yml
      service: os
  grobid:
    extends:
      file: docker-services.yml
      service: grobid
