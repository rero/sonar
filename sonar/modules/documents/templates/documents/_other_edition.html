{% if data %}
<dt class="col-lg-3">{{ fieldLabel }}</dt>
<dd class="col-lg-9">
  {% for element in data %}
  <p class="m-0">
    <a href="{{ element.document.electronicLocator }}"
      target="_blank">
      <i class="fa fa-external-link mx-1"></i>
      {{ element.publicNote }}
    </a>
  </p>
  {% endfor %}
</dd>
{% endif %}
