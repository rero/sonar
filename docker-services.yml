services:
  cache:
    image: redis
    restart: "unless-stopped"
    read_only: true
    command: redis-server --save ""
    ports:
      - "6379:6379"
  db:
    image: postgres:17
    restart: "unless-stopped"
    environment:
      - "POSTGRES_USER=sonar"
      - "POSTGRES_PASSWORD=sonar"
      - "POSTGRES_DB=sonar"
    ports:
      - "5432:5432"
  mq:
    image: rabbitmq:4.2-management
    restart: "unless-stopped"
    ports:
      - "15672:15672"
      - "5672:5672"
  os:
    build: ./docker/opensearch/
    image: sonar-os
    restart: "unless-stopped"
    environment:
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "discovery.type=single-node"
      - "plugins.security.disabled=true"
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=Str@wberry_77!"
      - "indices.query.bool.max_clause_count=3000"
      - "path.repo=/var/tmp"
      - "cluster.routing.allocation.disk.threshold_enabled=false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 3g
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - /var/tmp
  grobid:
    image: grobid/grobid:0.9.0-crf
    ports:
      - "8070:8070"
      - "8071:8071"
    environment:
      - JAVA_TOOL_OPTIONS=-XX:-UseContainerSupport
